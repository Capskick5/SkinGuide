spring:
  application:
    name: order-service
  mongodb:
    uri: ${MONGODB_URI_ORDER}
  data:
    mongodb:
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: ${ORDER_SERVICE_PORT}
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: aiskin-user-service
  http:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:5s}
    read-timeout: ${HTTP_READ_TIMEOUT:15s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:127.0.0.1}
    prefer-ip-address: false

logging:
  level:
    mss.orderservice: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

momo:
  endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
  partnerCode: ${MOMO_PARTNER_CODE:}
  accessKey: ${MOMO_ACCESS_KEY:}
  secretKey: ${MOMO_SECRET_KEY:}
  returnUrl: ${MOMO_RETURN_URL:http://localhost:5174/payment/momo-return}
  notifyUrl: ${MOMO_NOTIFY_URL:}

ghn:
  api-url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/v2}
  token: ${GHN_TOKEN}
  shop-id: ${GHN_SHOP_ID}
  webhook-secret: ${GHN_WEBHOOK_SECRET:${INTERNAL_SERVICE_TOKEN:${JWT_SECRET}}}

vnpay:
  tmnCode: ${VNPAY_TMN_CODE:}
  hashSecret: ${VNPAY_HASH_SECRET:}
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl: ${VNPAY_RETURN_URL:http://localhost:5174/payment/vnpay-return}
  apiUrl: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

product-service:
  base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
  internal-token: ${INTERNAL_SERVICE_TOKEN:${JWT_SECRET}}

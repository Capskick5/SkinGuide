spring:
  application:
    name: order-service
  mongodb:
    uri: ${MONGODB_URI_ORDER}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${ORDER_SERVICE_PORT}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: aiskin-user-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
  instance:
    prefer-ip-address: true

logging:
  level:
    mss.orderservice: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

momo:
  endpoint: https://test-payment.momo.vn/v2/gateway/api/create
  partnerCode: ${MOMO_PARTNER_CODE}
  accessKey: ${MOMO_ACCESS_KEY}
  secretKey: ${MOMO_SECRET_KEY}
  returnUrl: http://localhost:5173/payment/momo-return
  notifyUrl: ${MOMO_NOTIFY_URL}

ghn:
  api-url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/v2}
  token: ${GHN_TOKEN}
  shop-id: ${GHN_SHOP_ID}
  webhook-secret: ${GHN_WEBHOOK_SECRET:${INTERNAL_SERVICE_TOKEN:${JWT_SECRET}}}

vnpay:
  tmnCode: ${VNPAY_TMN_CODE:QY5D4FFD}
  hashSecret: ${VNPAY_HASH_SECRET:619Y7IGXCOH01PV7MKQNT00T8KGJ0O3D}
  url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
  apiUrl: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

product-service:
  base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
  internal-token: ${INTERNAL_SERVICE_TOKEN:${JWT_SECRET}}

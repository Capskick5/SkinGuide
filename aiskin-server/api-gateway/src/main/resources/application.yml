spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Auth endpoints (public): /api/auth/**
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
                
            # User endpoints (protected downstream): /api/users/**
            - id: user-service-users
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            # Admin endpoints: /api/admin/users/**
            - id: user-service-admin-users
              uri: lb://user-service
              predicates:
                - Path=/api/admin/users/**

            # Expose user-service OpenAPI doc through the gateway for Swagger aggregation
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/api-docs/user-service/**
              filters:
                - RewritePath=/api-docs/user-service/(?<segment>.*), /$\{segment}

            # Product service endpoints: /api/products/**, /api/brands/**, /api/categories/**, /api/ingredients/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**,/api/brands/**,/api/categories/**,/api/ingredients/**

            # Expose product-service OpenAPI doc through the gateway
            - id: product-service-api-docs
              uri: lb://product-service
              predicates:
                - Path=/api-docs/product-service/**
              filters:
                - RewritePath=/api-docs/product-service/(?<segment>.*), /$\{segment}

            # AI Scan service endpoints: /api/scans/**
            - id: ai-scan-service
              uri: lb://ai-scan-service
              predicates:
                - Path=/api/scans/**

            # Expose ai-scan-service OpenAPI doc through the gateway
            - id: ai-scan-service-api-docs
              uri: lb://ai-scan-service
              predicates:
                - Path=/api-docs/ai-scan-service/**
              filters:
                - RewritePath=/api-docs/ai-scan-service/(?<segment>.*), /$\{segment}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka/
  instance:
    prefer-ip-address: true

# Aggregated Swagger UI: one page with a dropdown per downstream service
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /api-docs/user-service/v3/api-docs
      - name: product-service
        url: /api-docs/product-service/v3/api-docs
      - name: ai-scan-service
        url: /api-docs/ai-scan-service/openapi.json

# Surface gateway routes for local debugging
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Auth endpoints (public): /api/auth/**
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
            # User endpoints (protected downstream): /api/users/**
            - id: user-service-users
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            # Expose user-service OpenAPI doc through the gateway for Swagger aggregation
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/api-docs/user-service/**
              filters:
                - RewritePath=/api-docs/user-service/(?<segment>.*), /$\{segment}

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Aggregated Swagger UI: one page with a dropdown per downstream service
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Show only the configured downstream services, not the gateway's own empty doc
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /api-docs/user-service/v3/api-docs

# Surface gateway routes for local debugging
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

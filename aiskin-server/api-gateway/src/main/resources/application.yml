spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Auth endpoints (public): /api/auth/**
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
                
            # User endpoints (protected downstream): /api/users/**
            - id: user-service-users
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            # Admin endpoints: /api/admin/users/**, roles, permissions
            - id: user-service-admin-users
              uri: lb://user-service
              predicates:
                - Path=/api/admin/users/**,/api/admin/roles/**,/api/admin/permissions/**

            # System endpoints cho user-service
            - id: user-service-system
              uri: lb://user-service
              predicates:
                - Path=/api/users/system/**

            # Expose user-service OpenAPI doc through the gateway for Swagger aggregation
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/api-docs/user-service/**
              filters:
                - RewritePath=/api-docs/user-service/(?<segment>.*), /$\{segment}

            # Product service endpoints
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**,/api/brands/**,/api/categories/**,/api/ingredients/**,/api/products/system/**

            # Expose product-service OpenAPI doc through the gateway
            - id: product-service-api-docs
              uri: lb://product-service
              predicates:
                - Path=/api-docs/product-service/**
              filters:
                - RewritePath=/api-docs/product-service/(?<segment>.*), /$\{segment}

            # AI Scan service endpoints: /api/scans/**
            - id: ai-scan-service
              uri: lb://ai-scan-service
              predicates:
                - Path=/api/scans/**

            # Expose ai-scan-service OpenAPI doc through the gateway
            - id: ai-scan-service-api-docs
              uri: lb://ai-scan-service
              predicates:
                - Path=/api-docs/ai-scan-service/**
              filters:
                - RewritePath=/api-docs/ai-scan-service/(?<segment>.*), /$\{segment}

            # Recommendation service endpoints
            - id: recommendation-service
              uri: lb://recommendation-service
              predicates:
                - Path=/api/v1/recommend/**

            # Expose recommendation-service OpenAPI doc through the gateway
            - id: recommendation-service-api-docs
              uri: lb://recommendation-service
              predicates:
                - Path=/api-docs/recommendation-service/**
              filters:
                - RewritePath=/api-docs/recommendation-service/(?<segment>.*), /$\{segment}

            # Order service endpoints
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**,/api/payments/**

            # Expose order-service OpenAPI doc through the gateway
            - id: order-service-api-docs
              uri: lb://order-service
              predicates:
                - Path=/api-docs/order-service/**
              filters:
                - RewritePath=/api-docs/order-service/(?<segment>.*), /$\{segment}

server:
  port: ${API_GATEWAY_PORT}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
  instance:
    prefer-ip-address: true

# Aggregated Swagger UI: one page with a dropdown per downstream service
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /api-docs/user-service/v3/api-docs
      - name: product-service
        url: /api-docs/product-service/v3/api-docs
      - name: ai-scan-service
        url: /api-docs/ai-scan-service/openapi.json
      - name: recommendation-service
        url: /api-docs/recommendation-service/openapi.json
      - name: order-service
        url: /api-docs/order-service/v3/api-docs

# Surface gateway routes for local debugging
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

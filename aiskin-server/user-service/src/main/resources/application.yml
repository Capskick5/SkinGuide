spring:
  application:
    name: user-service
  # Spring Boot 4.0: connection props moved to spring.mongodb.*
  mongodb:
    uri: ${MONGODB_URI_USER}
  data:
    mongodb:
      # Spring Data-specific behaviour stays under spring.data.mongodb
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000

server:
  port: ${USER_SERVICE_PORT}

# JWT / Auth configuration
app:
  jwt:
    # Base64-encoded 256-bit secret. OVERRIDE in production via env var.
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL}
    issuer: aiskin-user-service
  otp:
    ttl-seconds: ${OTP_TTL}
    length: 6
    # Dev only: return OTP in API response so you can test without a real email.
    expose-in-response: ${OTP_EXPOSE}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@aiskin.local}
    subject-prefix: ${MAIL_SUBJECT_PREFIX:[AiSkin]}
    log-otp: ${MAIL_LOG_OTP:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    mss.userservice: DEBUG

# SpringDoc / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

spring.application.name=discovery-server

# Eureka server runs on the standard discovery port
server.port=${DISCOVERY_SERVER_PORT}

# A standalone Eureka server should not register with or fetch from itself
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=127.0.0.1

# Faster eviction of dead instances in local/dev environments
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=15000
